services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookhaven-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: bookhaven-prod-secret-key-change-me
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - bookhaven-network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookhaven-web
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookhaven-network

networks:
  bookhaven-network:
    driver: bridge
